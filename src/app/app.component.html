<div class="page">
  <div class="leftside">
    <div class="logo">
      <div class="SP">SP</div>
      <div class="sp-text">
        <div style=" font-size: 13px;">S E R I G R A F I A</div>
        <div style=" font-weight: 700; font-size: 20px;">P O R T A L</div>
      </div>
    </div>

    <nav class="nav">
      @for (item of topNav; track $index) {
        <a class="nav-item" [class.active]="item.active">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

   <div style="flex: 1;"></div>

    <nav class="nav">
      @for (item of bottomNav; track $index) {
        <a class="nav-item">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="company">
      <div class="company-logo"><mat-icon>...</mat-icon></div>
      <div>
        <div style="font-size: 15px;">Micro Azur</div>
        <div style="font-size: 12px;">+41 76 473 67 64</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1>Orders</h1>
      <div class="top-actions">
        <button mat-icon-button><mat-icon>search</mat-icon></button>
        <button mat-icon-button>
          <mat-icon >chat</mat-icon>
        </button>
        <button mat-icon-button>
          <mat-icon>notifications_none</mat-icon>
        </button>
        <div class="user-div">
          <div class="user-icon"><mat-icon>home</mat-icon></div>
          <span>Hello, <strong>Eugenia</strong></span>
        </div>
      </div>
    </div>

    <div class="content">
     <app-orders />
    </div>
  </div>
</div>
